[platformio]
src_dir = main
data_dir = data
default_envs = e175_testbench

[env:e175_testbench]
platform = espressif32@6.9.0      ; ESP-IDF 5.x; bundle requires IDF >= 5.2
board = esp32-s3-devkitc-1
framework = espidf

; WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM (PSRAM enabled in sdkconfig.defaults)
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.f_flash = 80000000L
board_upload.maximum_size = 3145728   ; 3 MB factory partition
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM3     ; the "UART" USB-C port (CH343)
monitor_port = COM3
monitor_dtr = 0
monitor_rts = 0